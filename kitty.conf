# =============================================================================
# KITTY SESSION & WORKSPACE MANAGEMENT GUIDE
# =============================================================================
# Kitty uses built-in session actions rather than a background server (daemon).
# While running sub-processes terminate when Kitty exits, you can natively create,
# switch, restore, and destroy layout states across workspaces.
#
# NATIVE SESSION WORKFLOW:
# 1. Create folder:   mkdir -p ~/.config/kitty/sessions
# 2. Save Session:    Press Ctrl+a then s (prompts for session name)
# 3. Open/Switch:     Press Ctrl+a then o (opens interactive session picker)
# 4. Destroy/Close:   Press Ctrl+a then x (closes current active session)
#
# AUTOMATIC STARTUP SESSION (Optional):
# Uncomment the line below to auto-load a session layout when Kitty starts:
# startup_session ~/.config/kitty/sessions/default.session
# =============================================================================

# -----------------------------------------------------------------------------
# Fonts
# -----------------------------------------------------------------------------
font_family         JetBrainsMonoNerdFont
bold_font           auto
italic_font         auto
bold_italic_font    auto
font_size           12.0

# -----------------------------------------------------------------------------
# Sound & Visuals
# -----------------------------------------------------------------------------
enable_audio_bell   no
background_opacity  0.95

# -----------------------------------------------------------------------------
# Tab Bar (tmux-style bottom placement & 1-based index numbering)
# -----------------------------------------------------------------------------
tab_bar_edge        bottom
tab_powerline_style angled
tab_title_template  "{index}: {title}"

# Layouts required for tmux-style horizontal & vertical splitting
enabled_layouts     splits,stack

# -----------------------------------------------------------------------------
# Remote Control (Required for interactive session picker)
# -----------------------------------------------------------------------------
allow_remote_control yes
listen_on            unix:@mykitty

# -----------------------------------------------------------------------------
# Keybindings: Global Shortcuts
# -----------------------------------------------------------------------------
map f11 toggle_fullscreen

# -----------------------------------------------------------------------------
# Keybindings: Vim-like Pane Navigation (Alt + h/j/k/l)
# Matches: bind-key -n M-k/j/h/l
# -----------------------------------------------------------------------------
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right

# -----------------------------------------------------------------------------
# Keybindings: Reload Configuration (Alt + r)
# Matches: bind-key -n M-r source-file ~/.tmux.conf
# -----------------------------------------------------------------------------
map alt+r load_config_file

# -----------------------------------------------------------------------------
# Keybindings: Switch Tabs with Alt + Number
# Matches: bind-key -n M-1..0 select-window -t 1..0
# -----------------------------------------------------------------------------
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10

# -----------------------------------------------------------------------------
# Keybindings: Prefix Binds (Ctrl+a followed by key)
# Matches: Prefix C-a + ", %, c, z, s, o, x
# -----------------------------------------------------------------------------
# Split window horizontally in current directory (Ctrl+a then ")
map ctrl+a>" launch --location=hsplit --cwd=current

# Split window vertically in current directory (Ctrl+a then %)
map ctrl+a>% launch --location=vsplit --cwd=current

# Open new tab in current directory (Ctrl+a then c)
map ctrl+a>c launch --type=tab --cwd=current

# Zoom/Unzoom active pane (Ctrl+a then z)
map ctrl+a>z toggle_layout stack

# Save current session workspace layout (Ctrl+a then s)
map ctrl+a>s save_as_session --use-foreground-process --base-dir ~/.config/kitty/sessions

# Open interactive session picker (Ctrl+a then o)
map ctrl+a>o goto_session ~/.config/kitty/sessions

# Close/destroy active session (Ctrl+a then x)
map ctrl+a>x close_session .

# -----------------------------------------------------------------------------
# Theme: Catppuccin Latte
# -----------------------------------------------------------------------------
# BEGIN_KITTY_THEME
# Catppuccin-Latte
include current-theme.conf
# END_KITTY_THEME
